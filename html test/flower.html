<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Beautiful Flower Animation</title>
    <style>
        body {
            background: radial-gradient(circle at 50% 30%, #e3f2fd 0%, #fce4ec 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .flower-container {
            position: relative;
            width: 320px;
            height: 320px;
        }
        .stem {
            position: absolute;
            left: 155px;
            top: 170px;
            width: 10px;
            height: 150px;
            background: linear-gradient(to bottom, #388e3c 60%, #81c784 100%);
            border-radius: 5px;
            z-index: 0;
        }
        .leaf {
            position: absolute;
            left: 170px;
            top: 250px;
            width: 60px;
            height: 30px;
            background: #43a047;
            border-radius: 0 40px 40px 0;
            transform: rotate(-30deg);
            z-index: 1;
            opacity: 0.8;
        }
        .leaf2 {
            position: absolute;
            left: 90px;
            top: 260px;
            width: 60px;
            height: 30px;
            background: #43a047;
            border-radius: 40px 0 0 40px;
            transform: rotate(30deg);
            z-index: 1;
            opacity: 0.8;
        }
        .center {
            position: absolute;
            left: 120px;
            top: 120px;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle at 60% 40%, #fffde7 0%, #ffd600 80%);
            border-radius: 50%;
            z-index: 3;
            box-shadow: 0 0 30px #fff176, 0 0 10px #ffd600 inset;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 30px #fff176, 0 0 10px #ffd600 inset; }
            50% { box-shadow: 0 0 50px #fff176, 0 0 20px #ffd600 inset; }
        }
        .petal {
            position: absolute;
            width: 80px;
            height: 140px;
            background: radial-gradient(circle at 60% 20%, #f8bbd0 0%, #e91e63 80%);
            border-radius: 50px 50px 80px 80px / 100px 100px 40px 40px;
            opacity: 0.92;
            z-index: 2;
            animation: sway 3s infinite ease-in-out;
        }
        .petal1 { left: 120px; top: 20px; --angle: 0deg; }
        .petal2 { left: 200px; top: 60px; --angle: 60deg; }
        .petal3 { left: 210px; top: 150px; --angle: 120deg; }
        .petal4 { left: 120px; top: 200px; --angle: 180deg; }
        .petal5 { left: 30px; top: 150px; --angle: 240deg; }
        .petal6 { left: 30px; top: 60px; --angle: 300deg; }
        @keyframes sway {
            0% { transform: scaleY(1) rotate(var(--angle)); }
            50% { transform: scaleY(1.08) rotate(var(--angle)); }
            100% { transform: scaleY(1) rotate(var(--angle)); }
        }
        /* Sparkle effect */
        .sparkle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #fffde7;
            border-radius: 50%;
            opacity: 0.7;
            animation: sparkle 2s infinite;
        }
        .sparkle1 { left: 150px; top: 110px; animation-delay: 0s;}
        .sparkle2 { left: 180px; top: 140px; animation-delay: 0.5s;}
        .sparkle3 { left: 130px; top: 170px; animation-delay: 1s;}
        .sparkle4 { left: 170px; top: 200px; animation-delay: 1.5s;}
        @keyframes sparkle {
            0%, 100% { opacity: 0.7; transform: scale(1);}
            50% { opacity: 1; transform: scale(1.5);}
        }
    </style>
</head>
<body>
    <div class="flower-container">
        <div class="stem"></div>
        <div class="leaf"></div>
        <div class="leaf2"></div>
        <div class="center"></div>
        <div class="petal petal1"></div>
        <div class="petal petal2"></div>
        <div class="petal petal3"></div>
        <div class="petal petal4"></div>
        <div class="petal petal5"></div>
        <div class="petal petal6"></div>
        <div class="sparkle sparkle1"></div>
        <div class="sparkle sparkle2"></div>
        <div class="sparkle sparkle3"></div>
        <div class="sparkle sparkle4"></div>
    </div>
</body>
</html>
